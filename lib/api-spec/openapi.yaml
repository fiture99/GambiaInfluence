openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Unified API for GambiaInfluencers and Our Influencers platforms
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: influencers
    description: Influencer operations
  - name: businesses
    description: Business operations
  - name: stats
    description: Platform statistics
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: campaigns
    description: Campaign management
  - name: quickPromotions
    description: Quick promotion requests
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /influencers:
    get:
      operationId: listInfluencers
      tags: [influencers]
      summary: List all influencers
      parameters:
        - in: query
          name: location
          schema:
            type: string
        - in: query
          name: niche
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: List of influencers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Influencer"
    post:
      operationId: createInfluencer
      tags: [influencers]
      summary: Register as an influencer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInfluencerBody"
      responses:
        "201":
          description: Influencer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Influencer"

  /influencers/top:
    get:
      operationId: getTopInfluencers
      tags: [influencers]
      summary: Get top influencers by follower count
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Top influencers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Influencer"

  /influencers/{id}:
    get:
      operationId: getInfluencer
      tags: [influencers]
      summary: Get influencer by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Influencer found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Influencer"
        "404":
          description: Not found
    patch:
      operationId: updateInfluencer
      tags: [influencers]
      summary: Update influencer profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInfluencerBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Influencer"
    delete:
      operationId: deleteInfluencer
      tags: [influencers]
      summary: Delete influencer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /businesses:
    get:
      operationId: listBusinesses
      tags: [businesses]
      summary: List all businesses
      responses:
        "200":
          description: List of businesses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"
    post:
      operationId: createBusiness
      tags: [businesses]
      summary: Register as a business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBusinessBody"
      responses:
        "201":
          description: Business created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"

  /businesses/{id}:
    get:
      operationId: getBusiness
      tags: [businesses]
      summary: Get business by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Business found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
    patch:
      operationId: updateBusiness
      tags: [businesses]
      summary: Update business profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBusinessBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
    delete:
      operationId: deleteBusiness
      tags: [businesses]
      summary: Delete business
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /stats/platform:
    get:
      operationId: getPlatformStats
      tags: [stats]
      summary: Get overall platform statistics
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

  /stats/niches:
    get:
      operationId: getNicheBreakdown
      tags: [stats]
      summary: Get influencer count by niche
      responses:
        "200":
          description: Niche breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NicheCount"

  /stats/locations:
    get:
      operationId: getLocationBreakdown
      tags: [stats]
      summary: Get influencer count by location
      responses:
        "200":
          description: Location breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocationCount"

  # ─── Our Influencers: Auth ───────────────────────────────────────────────────

  /oi/auth/login:
    post:
      operationId: oiLogin
      tags: [auth]
      summary: Login as admin or client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OiLoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OiAuthResponse"
        "401":
          description: Invalid credentials

  /oi/auth/me:
    get:
      operationId: oiGetMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OiUser"
        "401":
          description: Unauthorized

  # ─── Our Influencers: Users ──────────────────────────────────────────────────

  /oi/users:
    get:
      operationId: oiListUsers
      tags: [users]
      summary: List all users (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OiUser"
    post:
      operationId: oiCreateUser
      tags: [users]
      summary: Create admin or client user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OiCreateUserBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OiUser"

  /oi/users/{id}:
    patch:
      operationId: oiUpdateUser
      tags: [users]
      summary: Update user (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OiUpdateUserBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OiUser"
    delete:
      operationId: oiDeleteUser
      tags: [users]
      summary: Delete user (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Our Influencers: Campaigns ──────────────────────────────────────────────

  /oi/campaigns:
    get:
      operationId: oiListCampaigns
      tags: [campaigns]
      summary: List campaigns (admin sees all, client sees own)
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OiCampaign"
    post:
      operationId: oiCreateCampaign
      tags: [campaigns]
      summary: Create campaign (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OiCreateCampaignBody"
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OiCampaign"

  /oi/campaigns/{id}:
    get:
      operationId: oiGetCampaign
      tags: [campaigns]
      summary: Get campaign details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OiCampaignDetail"
        "404":
          description: Not found
    patch:
      operationId: oiUpdateCampaign
      tags: [campaigns]
      summary: Update campaign status or post URL (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OiUpdateCampaignBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OiCampaign"
    delete:
      operationId: oiDeleteCampaign
      tags: [campaigns]
      summary: Delete campaign (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /oi/campaigns/stats/summary:
    get:
      operationId: oiGetCampaignSummary
      tags: [campaigns]
      summary: Get campaign statistics summary
      responses:
        "200":
          description: Campaign summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OiCampaignSummary"

  # ─── Our Influencers: Quick Promotions ───────────────────────────────────────

  /oi/quick-promotions:
    get:
      operationId: oiListQuickPromotions
      tags: [quickPromotions]
      summary: List quick promotion requests (admin only)
      responses:
        "200":
          description: List of quick promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OiQuickPromotion"
    post:
      operationId: oiCreateQuickPromotion
      tags: [quickPromotions]
      summary: Submit a quick promotion request (no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OiCreateQuickPromotionBody"
      responses:
        "201":
          description: Quick promotion submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OiQuickPromotion"

  /oi/quick-promotions/{id}:
    patch:
      operationId: oiUpdateQuickPromotion
      tags: [quickPromotions]
      summary: Update quick promotion status (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OiUpdateQuickPromotionBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OiQuickPromotion"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Influencer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        location:
          type: string
        niche:
          type: string
        followersCount:
          type: integer
        instagramUrl:
          type: ["string", "null"]
        tiktokUrl:
          type: ["string", "null"]
        youtubeUrl:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        whatsappNumber:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, location, niche, followersCount, instagramUrl, tiktokUrl, youtubeUrl, phone, whatsappNumber, bio, profileImageUrl, createdAt, updatedAt]

    CreateInfluencerBody:
      type: object
      properties:
        name:
          type: string
        location:
          type: string
        niche:
          type: string
        followersCount:
          type: integer
        instagramUrl:
          type: ["string", "null"]
        tiktokUrl:
          type: ["string", "null"]
        youtubeUrl:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        whatsappNumber:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
      required: [name, location, niche, followersCount]

    UpdateInfluencerBody:
      type: object
      properties:
        name:
          type: string
        location:
          type: string
        niche:
          type: string
        followersCount:
          type: integer
        instagramUrl:
          type: ["string", "null"]
        tiktokUrl:
          type: ["string", "null"]
        youtubeUrl:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        whatsappNumber:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]

    Business:
      type: object
      properties:
        id:
          type: integer
        businessName:
          type: string
        businessType:
          type: string
        contactEmail:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, businessName, businessType, contactEmail, contactPhone, location, description, website, createdAt, updatedAt]

    CreateBusinessBody:
      type: object
      properties:
        businessName:
          type: string
        businessType:
          type: string
        contactEmail:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
      required: [businessName, businessType]

    UpdateBusinessBody:
      type: object
      properties:
        businessName:
          type: string
        businessType:
          type: string
        contactEmail:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        website:
          type: ["string", "null"]

    PlatformStats:
      type: object
      properties:
        totalInfluencers:
          type: integer
        totalBusinesses:
          type: integer
        totalFollowers:
          type: integer
        topNiche:
          type: string
        topLocation:
          type: string
      required: [totalInfluencers, totalBusinesses, totalFollowers, topNiche, topLocation]

    NicheCount:
      type: object
      properties:
        niche:
          type: string
        count:
          type: integer
      required: [niche, count]

    LocationCount:
      type: object
      properties:
        location:
          type: string
        count:
          type: integer
      required: [location, count]

    # ─── Our Influencers Schemas ─────────────────────────────────────────────

    OiLoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    OiAuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/OiUser"
      required: [token, user]

    OiUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [admin, client]
        companyName:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, email, fullName, role, companyName, phone, createdAt]

    OiCreateUserBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [admin, client]
        companyName:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
      required: [email, password, fullName, role]

    OiUpdateUserBody:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        companyName:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        password:
          type: ["string", "null"]

    OiCampaign:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        budget:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, active, posted, completed, cancelled]
        postUrl:
          type: ["string", "null"]
        postedAt:
          type: ["string", "null"]
        clientId:
          type: integer
        influencerId:
          type: integer
        clientName:
          type: ["string", "null"]
        influencerName:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, title, status, clientId, influencerId, createdAt, updatedAt]

    OiCampaignDetail:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        budget:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, active, posted, completed, cancelled]
        postUrl:
          type: ["string", "null"]
        postedAt:
          type: ["string", "null"]
        clientId:
          type: integer
        influencerId:
          type: integer
        client:
          $ref: "#/components/schemas/OiUser"
        influencer:
          $ref: "#/components/schemas/Influencer"
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, title, status, clientId, influencerId, createdAt, updatedAt]

    OiCreateCampaignBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        budget:
          type: ["string", "null"]
        clientId:
          type: integer
        influencerId:
          type: integer
      required: [title, clientId, influencerId]

    OiUpdateCampaignBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        budget:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, active, posted, completed, cancelled]
        postUrl:
          type: ["string", "null"]

    OiCampaignSummary:
      type: object
      properties:
        total:
          type: integer
        pending:
          type: integer
        active:
          type: integer
        posted:
          type: integer
        completed:
          type: integer
        cancelled:
          type: integer
        totalBudget:
          type: string
      required: [total, pending, active, posted, completed, cancelled, totalBudget]

    OiQuickPromotion:
      type: object
      properties:
        id:
          type: integer
        influencerId:
          type: integer
        influencerName:
          type: ["string", "null"]
        contactName:
          type: string
        contactEmail:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        description:
          type: string
        promoType:
          type: string
        status:
          type: string
          enum: [new, contacted, in_progress, done]
        createdAt:
          type: string
      required: [id, influencerId, contactName, description, promoType, status, createdAt]

    OiCreateQuickPromotionBody:
      type: object
      properties:
        influencerId:
          type: integer
        contactName:
          type: string
        contactEmail:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        description:
          type: string
        promoType:
          type: string
      required: [influencerId, contactName, description, promoType]

    OiUpdateQuickPromotionBody:
      type: object
      properties:
        status:
          type: string
          enum: [new, contacted, in_progress, done]
